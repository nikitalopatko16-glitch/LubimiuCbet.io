<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Проснись — Stolken Loops</title>

  <style>
    * {
      box-sizing: border-box;
    }


    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      color: #1a2e33; /* тёмно‑сине‑серый, хорошо читается на фоне */
      background:
        radial-gradient(ellipse at 20% 30%, rgba(135, 206, 235, 0.6), transparent 45%),
        radial-gradient(ellipse at 80% 70%, rgba(46, 139, 87, 0.5), transparent 40%),
        linear-gradient(
          135deg,
          #e0f7fa,
          #a7d3d9 30%,
          #4db6ac 60%,
          #00897b
        );
    }

    .player-card {
      width: min(100%, 430px);
      padding: 28px;
      text-align: center;
      border: 1px solid rgba(255, 228, 196, 0.2);
      border-radius: 26px;
      background: rgba(35, 29, 27, 0.78);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(14px);
    }

    .cover {
      width: 100%;
      aspect-ratio: 1 / 1;
      margin: 0 auto 24px;
      overflow: hidden;
      border: 1px solid rgba(255, 220, 180, 0.25);
      border-radius: 20px;
      background: #241c19;
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.35);
    }

    .cover img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 58%;
    }

    .label {
      margin: 0 0 8px;
      color: #e6a86c;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #fff4e6;
      font-size: 32px;
    }

    .artist {
      margin: 9px 0 0;
      color: #cbb9a7;
      font-size: 16px;
    }

    audio {
      display: block;
      width: 100%;
      margin-top: 26px;
      accent-color: #e58b4a;
    }

    audio::-webkit-media-controls-panel {
      background-color: #f2e5d6;
    }

    .hint {
      margin: 16px 0 0;
      color: #bcae9f;
      font-size: 13px;
    }

    @media (max-width: 480px) {
      .player-card {
        padding: 22px;
      }

      h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>
  <main class="player-card">
    <div class="cover">
      <img src="cover.jpg" alt="Обложка песни «Проснись»">
    </div>

    <p class="label">Сейчас играет</p>
    <h1>Любимый цвет</h1>
    <p class="artist">Noize MC</p>

    <audio controls>
      <source src="I-Love-You-So-The-Walters.mp3" type="audio/mpeg">
      Ваш браузер не поддерживает аудиоэлемент.
    </audio>

    <p class="hint">Нажмите воспроизведение, чтобы послушать трек</p>
  </main>
</body>
</html>
